# Preset for LUMI (lumi.csc.fi) — EuroHPC/CSC supercomputer
# Verified: requests is system-provided; only zstandard needs pip install --user
#
# Usage: cp presets/lumi.conf hplt-sampler.conf
#        Then set ACCOUNT below.

ACCOUNT=""                   # Required: your project account (e.g. project_462000999)
WORKER_PARTITION="small"
MODULE_LOAD_CMD=""           # No module load needed; pip --user packages are sufficient
PYTHON="/usr/bin/python3"    # sees /appl/local/openeurollm (HPLT v4); the CSC AI python3 container does not
WORKER_MEM="4G"              # per-shard reservoirs are small; small-partition memory is billed as cores
# BATCH=180                  # Auto-set for lumi:small (200 running − 20 headroom); uncomment to override
COUNTS_INDEX=""             # shared counts index directory; TurkuNLP (project 462001491): /projappl/project_462001491/hplt-counts
# MAX_TASKS=200              # array tasks a run may queue at once (auto: 200 on small, the 220 submit cap minus headroom)
